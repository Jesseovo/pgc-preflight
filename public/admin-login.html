<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#fafbf8"><title>登录 · PGC OverFlow</title><link rel="stylesheet" href="/forge/progress.css"><style>
*{box-sizing:border-box}body{margin:0;background:#fafbf8;color:#314936;font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}main{max-width:400px;margin:12vh auto;padding:24px}.brand{display:flex;align-items:center;gap:12px;font-size:18px;letter-spacing:-.5px}.brand b{font-weight:500}.brand img{image-rendering:pixelated}form{margin-top:48px}small{font-size:10px;letter-spacing:2px;color:#91a184}h1{font-size:29px;letter-spacing:-1px;font-weight:600;margin:10px 0}p{font-size:12px;color:#8c9a87;margin:0 0 30px}label{display:block;font-size:12px;color:#72816c}input{display:block;width:100%;margin:9px 0 20px;min-height:45px;padding:10px 13px;border:1px solid #dfe6d8;border-radius:7px;background:white;color:#314936;font:inherit}button{width:100%;min-height:44px;border:1px solid #64855b;border-radius:7px;background:#64855b;color:white;font:inherit;font-size:13px;cursor:pointer}button:disabled{opacity:.6;cursor:default}input:focus-visible,button:focus-visible{outline:2px solid #9bb893;outline-offset:3px}#message{min-height:1.7em;margin-top:16px;color:#a07558;font-size:12px}@media(max-width:500px){main{margin:8vh auto;padding:28px}form{margin-top:40px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><main><div class="brand"><img src="/artwork/pixel-cat.png" width="38" height="38" alt=""><span>PGC <b>OverFlow</b></span></div><form id="login-form"><small>团队工作台</small><h1>欢迎回来</h1><p>登录后查看团队进展与作品。</p><label for="admin-password">管理员密码</label><input id="admin-password" type="password" autocomplete="current-password" required maxlength="500"><button class="primary" type="submit">进入工作台 →</button><p id="message" role="status"></p></form></main><script type="module" src="/admin-login.js"></script></body>
</html>
