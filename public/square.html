<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7f9f5">
  <title>游戏广场 · PGC Preflight</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/square/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="PGC Preflight 首页"><img src="/artwork/pixel-cat.png" alt="" width="32" height="32"><span>PGC <b>OverFlow</b></span></a>
      <nav aria-label="页面导航"><a class="current" href="/square" aria-current="page">游戏广场</a><a id="workspace-link" href="/">返回工作台 <span aria-hidden="true">↗</span></a></nav>
      <span class="member-name" id="member-name"></span>
    </div>
  </header>
  <main class="square-main" id="main">
    <section class="page-intro" aria-labelledby="page-title">
      <div class="intro-copy"><div class="intro-kicker"><span class="eyebrow">TEAM ARCADE</span><span class="status-chip"><i aria-hidden="true"></i>实时更新</span></div><h1 id="page-title">游戏广场<span class="title-dot" aria-hidden="true"></span></h1><p>真人终审通过的团队作品，挑一款，玩一会儿。</p></div>
      <div class="intro-summary" aria-label="广场概览"><div class="summary-art"><img class="intro-art" src="/artwork/pixel-console.svg" alt="" width="86" height="68"></div><div class="summary-copy"><strong id="hero-count">--</strong><span id="hero-label">款作品已收录</span></div></div>
    </section>
    <div id="session-state" class="session-state" role="status">正在确认登录状态…</div>
    <section id="catalog" hidden aria-label="游戏列表">
      <div class="catalog-toolbar">
        <div class="catalog-title"><span class="section-mark" aria-hidden="true"></span><div><strong>作品目录</strong><span>已通过真人终审的公开版本</span></div></div>
        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="search">搜索游戏标题或作者</label>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
          <input type="search" id="search" placeholder="搜索游戏标题或作者" maxlength="200" autocomplete="off">
          <button class="search-button" type="submit">搜索</button>
        </form>
        <label class="manage-toggle" id="manage-toggle" hidden><input type="checkbox" id="manage"><span class="switch" aria-hidden="true"></span><span>管理模式</span></label>
      </div>
      <div class="results-heading"><p id="result-count" role="status"></p><span class="sort-note"><span class="sort-dot" aria-hidden="true"></span>按通过时间排序</span></div>
      <div id="results" aria-busy="false"></div>
      <nav id="pagination" class="pagination" aria-label="游戏分页" hidden><button type="button" id="previous" class="secondary-button">← 上一页</button><span id="page-label"></span><button type="button" id="next" class="secondary-button">下一页 →</button></nav>
    </section>
  </main>
  <footer class="site-footer"><span>PGC Preflight</span><span>分享创作，发现好游戏。</span></footer>
  <dialog id="player" class="player-dialog" aria-labelledby="player-title" aria-describedby="player-meta">
    <div class="player-shell">
      <header class="player-header"><div class="player-heading"><span class="eyebrow">NOW PLAYING</span><h2 id="player-title">正在打开游戏</h2><p id="player-meta"></p></div><button type="button" id="player-close" class="close-button" aria-label="关闭试玩"><span aria-hidden="true">×</span><span>关闭</span></button></header>
      <div class="player-toolbar"><div class="view-switch" role="group" aria-label="试玩视口"><button type="button" id="view-phone" aria-pressed="true">手机视口</button><button type="button" id="view-fit" aria-pressed="false">适应窗口</button></div><button type="button" id="player-restart" class="restart-button" disabled><span aria-hidden="true">↻</span> 重新开始</button></div>
      <div class="player-stage" id="player-stage"><div id="game-viewport" class="game-viewport" data-mode="phone"></div><div class="player-state" id="player-state" role="status"></div></div>
      <p class="player-footnote">试玩预览 · PGC Preflight</p>
    </div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/square/app.js"></script>
</body>
</html>
